title = "public leak scan"

[extend]
useDefault = true

[allowlist]
description = "documented synthetic fixtures in the publication-safety tests, and backlog epic ids that trip generic-api-key entropy"
paths = [
  '''^tests/publish_safety\.test\.ts$''',
  '''^tests/test_publish_safety\.py$''',
]
regexTarget = "line"
regexes = ['''"key": "epic-[a-z0-9-]+"''']
